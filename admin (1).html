<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Volunteer</title>
<style>
body{margin:0;font-family:system-ui;background:#f1f5f9;padding:10px}
.box{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;background:#0d47a1;color:#fff;padding:12px 16px;border-radius:10px}
input{padding:10px;border:1px solid #ccc;border-radius:8px}
.card{background:#fff;border-radius:10px;padding:10px;margin-top:10px;box-shadow:0 2px 6px #0001;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btn{padding:6px 10px;border:0;border-radius:6px;color:#fff;font-weight:700;cursor:pointer}
.ap{background:#2e7d32} .re{background:#c62828} .pe{background:#ef6c00}
table{width:100%;border-collapse:collapse;margin-top:12px;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:8px 6px;font-size:12px;border-bottom:1px solid #eee;text-align:left}
th{background:#0d47a1;color:#fff}
</style>
</head>
<body>
<div class="box">
<div class="top"><h3 style="margin:0">এডমিন প্যানেল</h3><div><input id="token" type="password" placeholder="Admin Token"><button onclick="load()" style="padding:10px;background:#fff;border:0;border-radius:8px;font-weight:700">লগইন</button></div></div>
<div id="list"></div>
<table id="table" style="display:none"><thead><tr><th>ID</th><th>নাম</th><th>মোবাইল</th><th>জেলা</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<script>
let TOKEN='';
async function load(){
 TOKEN=document.getElementById('token').value.trim();
 if(!TOKEN){ alert('Token দিন'); return; }
 const r=await fetch('/api/admin/volunteers',{headers:{'X-Admin-Token':TOKEN}});
 const j=await r.json();
 if(!j.success){ alert(j.message); return; }
 document.getElementById('table').style.display='table';
 const tb=document.getElementById('tbody');
 tb.innerHTML='';
 j.data.forEach(d=>{
  tb.innerHTML+=`<tr><td>${d.id}<br><small>${new Date(d.created_at).toLocaleDateString()}</small></td><td>${d.name}<br><small>${d.father_name}</small></td><td>${d.mobile}</td><td>${d.district}</td><td><span style="padding:3px 8px;border-radius:12px;background:${d.status==='approved'?'#e8f5e9':d.status==='rejected'?'#ffebee':'#fff3e0'}">${d.status}</span></td><td><button class="btn ap" onclick="updateStatus('${d.id}','approved')">✓</button> <button class="btn re" onclick="updateStatus('${d.id}','rejected')">✕</button> <button class="btn pe" onclick="updateStatus('${d.id}','pending')">↺</button><br><a href="/download.html?id=${d.id}" target="_blank" style="font-size:11px">View</a></td></tr>`;
 });
}

async function updateStatus(id,status){
 if(!confirm(id+' কে '+status+' করবেন?')) return;
 const r=await fetch('/api/admin/volunteer/'+id,{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Token':TOKEN},body:JSON.stringify({status})});
 const j=await r.json();
 alert(j.message); load();
}
</script>
</body>
</html>
