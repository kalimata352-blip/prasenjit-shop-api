<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আবেদন স্লিপ ডাউনলোড</title>
<style>
body{margin:0;font-family:system-ui;background:#eef2f7;padding:10px}
.box{max-width:580px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 4px 12px #0001;overflow:hidden}
.head{background:#0d47a1;color:#fff;padding:14px;text-align:center}
.content{padding:14px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #ddd;font-size:14px}
.row b{max-width:60%;text-align:right}
.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;margin-top:10px;font-size:15px}
.btn1{background:#2e7d32;color:#fff} .btn2{background:#0d47a1;color:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;color:#fff;font-size:12px;font-weight:700}
@media print{.no-print{display:none} body{background:#fff} .box{box-shadow:none}}
</style>
</head>
<body>
<div class="box">
<div class="head"><h2 style="margin:0">আবেদন স্লিপ</h2><p id="sub" style="margin:4px 0 0;font-size:12px;opacity:0.9"></p></div>
<div class="content">
<div id="loading" style="text-align:center;padding:20px">লোড হচ্ছে...</div>
<div id="main" style="display:none">
<div id="pdfArea" style="border:1.5px solid #0d47a1;border-radius:10px;padding:12px">
<div style="text-align:center;border-bottom:1px solid #ddd;padding-bottom:8px;margin-bottom:8px">
<b>প্রসেনজিৎ স্বেচ্ছাসেবক নিয়োগ</b><br><small>ID: <span id="vid"></span> | <span id="vdate"></span></small><br>
<span id="statusBadge"></span>
</div>
<div id="details"></div>
<p style="font-size:10px;color:#777;text-align:center;margin-top:12px">এটি সিস্টেম জেনারেটেড স্লিপ। এডমিন যাচাই করার পর স্ট্যাটাস আপডেট হবে।</p>
</div>
<button class="btn btn1 no-print" onclick="window.print()">📥 PDF ডাউনলোড / প্রিন্ট (মোবাইলে Save as PDF)</button>
<a href="/" class="no-print" style="display:block;text-align:center;margin-top:12px;color:#0d47a1;text-decoration:none">← হোমে ফিরুন</a>
</div>
</div>
</div>
<script>
async function load(){
 const id=new URLSearchParams(location.search).get('id');
 if(!id){ document.getElementById('loading').innerText='ID পাওয়া যায়নি'; return; }
 try{
  const r=await fetch('/api/volunteer/data/'+encodeURIComponent(id));
  const j=await r.json();
  if(!j.success){ document.getElementById('loading').innerText='তথ্য পাওয়া যায়নি'; return; }
  const d=j.data;
  document.getElementById('vid').innerText=d.id;
  document.getElementById('vdate').innerText=new Date(d.created_at).toLocaleDateString('bn-IN');
  document.getElementById('sub').innerText='মোবাইল: '+d.mobile;
  const color=d.status==='approved'?'#2e7d32':d.status==='rejected'?'#c62828':'#ef6c00';
  document.getElementById('statusBadge').innerHTML=`<span class="badge" style="background:${color}">${d.status.toUpperCase()}</span>`;
  document.getElementById('details').innerHTML=`
   <div class="row"><span>নাম</span><b>${d.name}</b></div>
   <div class="row"><span>পিতার নাম</span><b>${d.father_name}</b></div>
   <div class="row"><span>মোবাইল</span><b>${d.mobile}</b></div>
   <div class="row"><span>WhatsApp</span><b>${d.whatsapp||'-'}</b></div>
   <div class="row"><span>জন্ম তারিখ</span><b>${d.dob||'-'}</b></div>
   <div class="row"><span>লিঙ্গ</span><b>${d.gender||'-'}</b></div>
   <div class="row"><span>জেলা</span><b>${d.district||'-'}</b></div>
   <div class="row"><span>বিধানসভা</span><b>${d.assembly||'-'}</b></div>
   <div class="row"><span>যোগ্যতা</span><b>${d.qualification||'-'}</b></div>
   <div class="row"><span>অভিজ্ঞতা</span><b>${d.experience||'-'}</b></div>
   <div class="row"><span>ঠিকানা</span><b>${d.full_address||'-'}</b></div>
  `;
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='block';
 }catch(e){ document.getElementById('loading').innerText='এরর: '+e.message; }
}
load();
</script>
</body>
</html>
