<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্বেচ্ছাসেবক আবেদন - প্রসেনজিৎ</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system;background:#eef2f7;padding:0}
.top{background:#0d47a1;color:#fff;padding:16px;text-align:center}
.top h1{margin:0;font-size:20px} .top p{margin:4px 0 0;font-size:12px;opacity:0.9}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 12px #0001}
label{display:block;font-size:13px;font-weight:700;margin-top:14px;color:#222}
label span{color:red}
input,select,textarea{width:100%;padding:12px 10px;margin-top:6px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#0d47a1;outline:none}
.btn{width:100%;padding:14px;background:#0d47a1;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:800;margin-top:20px}
.btn:disabled{opacity:0.6}
.res{margin-top:14px;padding:12px;border-radius:10px;display:none;text-align:center;font-size:14px}
.status-box{margin-top:22px;border-top:1px solid #ddd;padding-top:16px}
.status-box b{font-size:15px}
.s-input{display:flex;gap:8px;margin-top:8px}
.s-input input{flex:1}
.s-input button{padding:10px 14px;background:#222;color:#fff;border:0;border-radius:8px}
</style>
</head>
<body>
<div class="top"><h1>প্রসেনজিৎ স্বেচ্ছাসেবক নিয়োগ</h1><p>একই মোবাইল নম্বর দুবার ব্যবহার হবে না</p></div>
<div class="wrap">
<div class="card">
<form id="f">
<label>পুরো নাম <span>*</span></label><input name="name" required>
<label>পিতার নাম <span>*</span></label><input name="father_name" required>
<label>জন্ম তারিখ</label><input name="dob" type="date">
<label>লিঙ্গ</label><select name="gender"><option value="পুরুষ">পুরুষ</option><option value="মহিলা">মহিলা</option><option value="অন্যান্য">অন্যান্য</option></select>
<label>মোবাইল নম্বর (১০ সংখ্যা) <span>*</span></label><input name="mobile" type="tel" pattern="[6-9][0-9]{9}" maxlength="10" required>
<label>WhatsApp নম্বর</label><input name="whatsapp" type="tel" maxlength="10">
<label>সম্পূর্ণ ঠিকানা <span>*</span></label><textarea name="full_address" rows="3" required></textarea>
<label>জেলা</label><input name="district" value="বীরভূম">
<label>বিধানসভা</label><input name="assembly">
<label>শিক্ষাগত যোগ্যতা</label><input name="qualification">
<label>অভিজ্ঞতা</label><input name="experience">
<button id="btn" class="btn" type="submit">আবেদন জমা দিন</button>
</form>
<div id="res" class="res"></div>

<div class="status-box">
<b>আবেদন স্ট্যাটাস দেখুন</b>
<div class="s-input"><input id="sid" inputmode="numeric"><button onclick="checkStatus()">দেখুন</button></div>
<div id="sbox" style="margin-top:10px;font-size:13px"></div>
</div>
</div>
</div>

<script>
document.getElementById('f').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const btn=document.getElementById('btn'); btn.innerText='জমা হচ্ছে...'; btn.disabled=true;
 const data=Object.fromEntries(new FormData(e.target).entries());
 try{
  const r=await fetch('/api/volunteer/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const j=await r.json();
  const box=document.getElementById('res'); box.style.display='block';
  if(j.success){
   box.style.background='#e8f5e9'; box.style.border='1px solid #4caf50';
   box.innerHTML=`✅ আবেদন সফল!<br>আপনার আইডি: <b>${j.volunteer_id}</b><br><br><a href="/download.html?id=${j.volunteer_id}" style="display:inline-block;background:#0d47a1;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none">📥 ফর্ম ডাউনলোড করুন</a><br><br><small>এই আইডি মনে রাখুন, পরে স্ট্যাটাস দেখতে লাগবে</small>`;
   e.target.reset();
  }else{
   box.style.background='#ffebee'; box.style.border='1px solid #e53935';
   box.innerHTML=j.message + (j.existing_id?`<br>আগের আইডি: <b>${j.existing_id}</b><br><a href="/download.html?id=${j.existing_id}">ডাউনলোড</a>`:'');
  }
 }catch(err){ alert('নেটওয়ার্ক সমস্যা'); }
 btn.innerText='আবেদন জমা দিন'; btn.disabled=false;
});

async function checkStatus(){
 const id=document.getElementById('sid').value.trim();
 if(!id) return;
 const r=await fetch('/api/volunteer/status/'+encodeURIComponent(id));
 const j=await r.json();
 const b=document.getElementById('sbox');
 if(j.success){
  const color=j.data.status==='approved'?'green':j.data.status==='rejected'?'red':'orange';
  b.innerHTML=`নাম: ${j.data.name}<br>আইডি: ${j.data.id}<br>স্ট্যাটাস: <b style="color:${color}">${j.data.status.toUpperCase()}</b><br><a href="/download.html?id=${j.data.id}">ডাউনলোড স্লিপ</a>`;
 }else b.innerHTML=`<span style="color:red">${j.message}</span>`;
}
</script>
</body>
</html>
